<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B5D4D" />
    <meta name="description" content="Ghar Se — hyperlocal home-cook marketplace in Sirsi, Karnataka. Order festival sweets, pickles and snacks made by trusted home makers." />

    <!-- Security: defence-in-depth headers. The server MUST also set these via HTTP for them to be enforceable. -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(self)" />
    <!-- CSP is intentionally permissive in dev (Vite needs ws + inline). Tighten via server headers in prod — see README. -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..900&family=Inter:wght@400..900&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />

    <title>Ghar Se · घर से — Home makers of Sirsi</title>
  </head>
  <body class="bg-cream antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
